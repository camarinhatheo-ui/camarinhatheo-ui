    <text x="442" y="44" font-size="13" fill="#5A5A5A">02</text>
    <text x="852" y="44" font-size="13" fill="#5A5A5A">03</text>
  </g>

  <g stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#sketch)">
