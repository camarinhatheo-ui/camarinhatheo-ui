    <text x="442" y="206" font-size="22" font-weight="700" fill="#FFFFFF">SaaS platforms</text>
    <text x="442" y="236" font-size="15" fill="#8A8A8A">Database, API and UI.</text>
    <text x="442" y="258" font-size="15" fill="#8A8A8A">The whole thing.</text>

    <text x="852" y="206" font-size="22" font-weight="700" fill="#FFFFFF">Tools for schools</text>
