    <circle cx="190" cy="62" r="9" fill="#0A0A0A"/>
    <circle cx="190" cy="100" r="9" fill="#FFFFFF"/>
    <circle cx="190" cy="138" r="9" fill="#0A0A0A"/>
    <circle cx="240" cy="82" r="9" fill="#0A0A0A"/>
    <circle cx="240" cy="120" r="9" fill="#0A0A0A"/>

