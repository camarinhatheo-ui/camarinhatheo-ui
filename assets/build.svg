    <rect x="520" y="52" width="160" height="104" rx="8"/>
    <path d="M520 72 H 680"/>
    <circle cx="533" cy="62" r="2.5"/><circle cx="543" cy="62" r="2.5"/><circle cx="553" cy="62" r="2.5"/>
    <path d="M540 140 V 116 M568 140 V 102 M596 140 V 110 M624 140 V 92 M652 140 V 84" stroke-width="9" stroke-linecap="butt"/>
